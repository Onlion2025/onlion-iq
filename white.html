<style>
*{box-sizing:border-box;margin:0;padding:0}

body{background:#f5f3ee;color:#1a1a1a;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

<body>
<div id="root"></div>
<script type="text/babel">

const G="#7AC800",GL="#8FD400",GD="#5A9600",GLight="#f0f9e0";
const BG="#f5f3ee",BG2="#fff",BG3="#f0ede6";
const TX="#1a1a1a",T2="#666",T3="#aaa";
const BD="#e0ddd5",BD2="#ccc";

const KC={ki:G,rpa:"#0066cc",robotik:"#cc4400",daten:"#6600cc"};
const KL={ki:"KI-Agent",rpa:"Automatisierung",robotik:"Robotik",daten:"Analytics"};
const KT={
  ki:"KI-Agenten übernehmen repetitive Aufgaben, beantworten Kundenanfragen automatisch und analysieren Daten in Echtzeit — rund um die Uhr.",
  rpa:"Robotic Process Automation automatisiert manuelle Klick- und Tipp-Aufgaben in bestehenden Systemen — ohne Programmierung, sofort einsetzbar.",
  robotik:"Physische Roboter und kollaborative Cobots übernehmen körperliche Aufgaben in Produktion, Lager und Logistik — präzise und ermüdungsfrei.",
  daten:"Echtzeit-Dashboards und KI-gestützte Analysen ersetzen manuelle Excel-Auswertungen — Entscheidungen auf Basis aktueller Daten."
};
const BRANCHEN=["Produktion / Fertigung","Dienstleistung / Büro","Handel / Logistik","IT / Technologie","Gesundheit / Pflege","Bildung","Finanzen / Versicherung","Sonstige"];

function safe(s){return(s||"").replace(/[^\w\s.,\-äöüÄÖÜß]/g," ").replace(/\s+/g," ").trim();}

function parseBereicheText(text,branche){
  var bereiche=[];
  var blocks=text.split(/\n(?=BEREICH)/);
  for(var i=0;i<blocks.length&&bereiche.length<6;i++){
    var block=blocks[i].trim();
    if(!block)continue;
    var lines=block.split("\n").map(l=>l.trim()).filter(l=>l);
    if(lines.length<4)continue;
    var label=lines[0].replace(/^BEREICH\s*\d*[:.\s]*/i,"").trim();
    var icon=lines[1]||"⚙️";
    var hint=lines[2]||"";
    var kat="rpa";
    var ll=label.toLowerCase()+hint.toLowerCase();
    if(ll.includes("ki ")||ll.includes("chatbot")||ll.includes("agent"))kat="ki";
    else if(ll.includes("robot")||ll.includes("maschine"))kat="robotik";
    else if(ll.includes("daten")||ll.includes("analytic")||ll.includes("dashboard"))kat="daten";
    var fragen=[];
    var fragenBlock=lines.slice(3).join("\n");
    var fmatches=fragenBlock.split(/FRAGE\s*\d*[:.\s]*/i).filter(f=>f.trim());
    for(var j=0;j<fmatches.length&&fragen.length<4;j++){
      var flines=fmatches[j].split("\n").map(l=>l.trim()).filter(l=>l);
      if(flines.length<5)continue;
      var optionen=flines.slice(1,5);
      if(optionen.length===4)fragen.push({f:flines[0],o:optionen});
    }
    if(fragen.length>0)bereiche.push({id:"b"+(i+1),label,icon,hint,kiKat:kat,fragen});
  }
  if(bereiche.length<3)return getDefault(branche);
  return bereiche;
}

function getDefault(branche){
  var p=branche==="Gesundheit / Pflege";
  return[
    {id:"b1",label:p?"Patientenverwaltung":"Geschäftsprozesse",icon:p?"🏥":"⚙️",kiKat:"rpa",hint:"Automatisierung spart täglich wertvolle Zeit.",fragen:[
      {f:p?"Wie werden Patiententermine verwaltet?":"Wie werden Aufträge bearbeitet?",o:["Vollständig manuell","Teilweise digital","Größtenteils automatisiert","Vollständig automatisiert"]},
      {f:"Wie werden Dokumente verarbeitet?",o:["Nur auf Papier","Eingescannt manuell","Digital teilweise automatisch","Vollautomatisch"]},
      {f:"Wie lange dauert ein Vorgang durchschnittlich?",o:["Über 1 Stunde","30-60 Minuten","10-30 Minuten","Unter 10 Minuten"]},
      {f:"Wie werden Status-Updates kommuniziert?",o:["Nur auf Nachfrage","Manuell per Telefon","Teilweise automatisch","Vollautomatisch"]}
    ]},
    {id:"b2",label:"Finanzen",icon:"💰",kiKat:"rpa",hint:"RPA kann Rechnungen automatisieren.",fragen:[
      {f:"Wie werden Rechnungen erstellt?",o:["Manuell auf Papier","Software, viel manuell","Halbautomatisch","Vollautomatisch"]},
      {f:"Wie werden Zahlungen verbucht?",o:["Manuell","Teilweise digital","Software mit Kontrolle","Vollautomatisch"]},
      {f:"Wie wird das Mahnwesen gehandhabt?",o:["Manuell per Post","Excel-gestützt","Halbautomatisch","Vollautomatisch"]},
      {f:"Wie lange dauert der Monatsabschluss?",o:["Über 3 Tage","1-3 Tage","Halber Tag","Vollautomatisch"]}
    ]},
    {id:"b3",label:"Kommunikation",icon:"💬",kiKat:"ki",hint:"KI-Agenten beantworten Standardanfragen automatisch.",fragen:[
      {f:"Wie werden Kundenanfragen bearbeitet?",o:["Nur Telefon manuell","E-Mail manuell","E-Mail mit Vorlagen","KI-gestützt automatisch"]},
      {f:"Gibt es automatisierte Benachrichtigungen?",o:["Nein","Gelegentlich","Für bestimmte Ereignisse","Vollautomatisch"]},
      {f:"Wie schnell werden Anfragen beantwortet?",o:["Über 24 Stunden","Innerhalb 24 Stunden","Innerhalb 4 Stunden","Unter 1 Stunde"]},
      {f:"Wie wird interne Kommunikation organisiert?",o:["Nur mündlich","E-Mail","Chat-Tools","Integrierte Plattform"]}
    ]},
    {id:"b4",label:"Personal & HR",icon:"👥",kiKat:"rpa",hint:"Digitale HR-Prozesse sparen bis zu 10h pro Woche.",fragen:[
      {f:"Wie wird die Arbeitszeit erfasst?",o:["Papier oder Excel","Digitale Stempeluhr","Software automatisch","Mit Lohnabrechnung verknüpft"]},
      {f:"Wie läuft das Onboarding ab?",o:["Informell persönlich","Checkliste Papier","Digitale Checkliste","Automatisiertes System"]},
      {f:"Wie werden Urlaubsanträge verwaltet?",o:["Manuell per Formular","Per E-Mail","Software mit Genehmigung","Vollautomatisch"]},
      {f:"Wie werden Lohnzahlungen abgewickelt?",o:["Manuell berechnet","Externe Lohnbuchhaltung","Software mit Kontrolle","Vollautomatisch"]}
    ]},
    {id:"b5",label:"Datenverarbeitung",icon:"📊",kiKat:"daten",hint:"Echtzeit-Dashboards ersetzen manuelle Excel-Berichte.",fragen:[
      {f:"Wie entstehen interne Berichte?",o:["Manuell in Excel","Vorlagen manuell","Software manuell gestartet","Automatisch in Echtzeit"]},
      {f:"Wie werden Daten übertragen?",o:["Per E-Mail","Manuell kopiert","Teilweise automatisch","Vollautomatisch per API"]},
      {f:"Wie aktuell sind Geschäftszahlen?",o:["Monatsweise","Wöchentlich","Täglich","Echtzeit"]},
      {f:"Wie werden Entscheidungen getroffen?",o:["Aus dem Bauch","Auf Basis alter Daten","Auf Basis aktueller Reports","Datengetrieben in Echtzeit"]}
    ]},
    {id:"b6",label:"Betrieb & Logistik",icon:"🏭",kiKat:"robotik",hint:"Robotik und Automatisierung senken Betriebskosten.",fragen:[
      {f:"Wie wird der Bestand verwaltet?",o:["Manuell mit Listen","Einfache Software","Lagersoftware teilweise","Automatisch mit RFID"]},
      {f:"Wie läuft die Wartung ab?",o:["Nur bei Ausfall","Feste Intervalle","Digitale Wartungspläne","Automatische Überwachung"]},
      {f:"Wie werden Lieferungen koordiniert?",o:["Telefonisch manuell","Per E-Mail","Software teilweise","Vollautomatisch"]},
      {f:"Wie wird Qualitätskontrolle durchgeführt?",o:["Nur manuell","Stichproben manuell","Software-gestützt","Automatisiert mit Sensorik"]}
    ]}
  ];
}

/* ── UI COMPONENTS ── */
function Logo({dark=false}){
  const c=dark?"#1a1a1a":TX;
  return(
    <div style={{marginBottom:32}}>
      <div style={{fontWeight:600,fontSize:20,letterSpacing:2,color:c,display:"flex",alignItems:"center",gap:1}}>
        <span>ON</span><span style={{color:G}}>L</span><span>ION</span>
        <span style={{color:G,marginLeft:6,fontSize:18}}>IQ</span>
      </div>
      <div style={{fontSize:10,color:T3,letterSpacing:3,marginTop:3,textTransform:"uppercase",fontWeight:500}}>Intelligence Quotient</div>
    </div>
  );
}

function Spinner(){
  return <span style={{display:"inline-block",width:16,height:16,border:`1.5px solid ${G}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>;
}

function Tag({color,children}){
  return(
    <span style={{
      display:"inline-block",padding:"2px 10px",borderRadius:20,
      background:color+"15",border:`1px solid ${color}30`,
      fontSize:10,color:color,fontWeight:500,letterSpacing:0.3
    }}>{children}</span>
  );
}

function Card({children,style={},accent=null}){
  return(
    <div style={{
      background:BG2,border:`1px solid ${BD}`,borderRadius:12,
      padding:"1.25rem",marginBottom:14,
      borderLeft:accent?`3px solid ${accent}`:"1px solid "+BD,
      ...style
    }}>{children}</div>
  );
}

function GreenBtn({onClick,children,disabled=false,style={}}){
  return(
    <button onClick={onClick} disabled={disabled} style={{
      width:"100%",padding:"13px",borderRadius:10,
      border:`1px solid ${disabled?"#ddd":G}`,
      background:disabled?"#f5f5f5":G,
      cursor:disabled?"not-allowed":"pointer",
      fontSize:14,color:disabled?T3:"#fff",
      fontWeight:500,letterSpacing:0.3,
      transition:"all 0.2s",...style
    }}
    onMouseEnter={e=>{if(!disabled)e.target.style.background=GL}}
    onMouseLeave={e=>{if(!disabled)e.target.style.background=G}}
    >{children}</button>
  );
}

function OutlineBtn({onClick,children,style={}}){
  return(
    <button onClick={onClick} style={{
      width:"100%",padding:"11px",borderRadius:10,
      border:`1px solid ${BD}`,background:"transparent",
      cursor:"pointer",fontSize:14,color:T2,marginTop:8,
      transition:"all 0.2s",...style
    }}
    onMouseEnter={e=>{e.target.style.borderColor=BD2;e.target.style.color=TX}}
    onMouseLeave={e=>{e.target.style.borderColor=BD;e.target.style.color=T2}}
    >{children}</button>
  );
}

function IQMeter({score}){
  const c=score>66?G:score>33?"#d4a000":"#cc3333";
  const dash=(score/100*188);
  const label=score>66?"Gut digitalisiert":score>33?"Ausbaufähig":"Hohes Potenzial";
  return(
    <div style={{textAlign:"center",padding:"1.5rem 0"}}>
      <svg width="160" height="90" viewBox="0 0 160 90" style={{overflow:"visible"}}>
        <path d="M 15 78 A 65 65 0 0 1 145 78" fill="none" stroke="#eee" strokeWidth="8" strokeLinecap="round"/>
        <path d="M 15 78 A 65 65 0 0 1 145 78" fill="none" stroke={c} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={`${dash} 204`}
          style={{transition:"stroke-dasharray 1s cubic-bezier(0.4,0,0.2,1)"}}
        />
        <text x="80" y="72" textAnchor="middle" fontSize="24" fontWeight="600" fill={TX} fontFamily="Inter,sans-serif">{score}%</text>
      </svg>
      <div style={{fontSize:12,color:c,marginTop:2,fontWeight:500,letterSpacing:1}}>{label}</div>
    </div>
  );
}

function LoadBox({msg,sub,steps=[]}){
  return(
    <div style={{background:BG2,border:`1px solid ${BD}`,borderRadius:12,padding:"2rem",textAlign:"center",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><Spinner/></div>
      <div style={{fontSize:15,color:TX,marginBottom:4,fontWeight:500}}>{msg}</div>
      <div style={{fontSize:12,color:T2,marginBottom:20}}>{sub}</div>
      <div style={{display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap"}}>
        {steps.map((t,i)=>(
          <span key={i} style={{fontSize:11,color:T2,background:BG3,padding:"4px 12px",borderRadius:20,border:`1px solid ${BD}`,animation:`pulse ${1+i*0.4}s ease-in-out infinite`}}>{t}</span>
        ))}
      </div>
    </div>
  );
}

/* ── MAIN APP ── */
function App(){
  const [step,setStep]=React.useState("intro");
  const [branche,setBranche]=React.useState("");
  const [firma,setFirma]=React.useState("");
  const [desc,setDesc]=React.useState("");
  const [email,setEmail]=React.useState("");
  const [bereiche,setBereiche]=React.useState([]);
  const [aktiv,setAktiv]=React.useState([]);
  const [loadB,setLoadB]=React.useState(false);
  const [bIdx,setBIdx]=React.useState(0);
  const [antw,setAntw]=React.useState({});
  const [loadR,setLoadR]=React.useState(false);
  const [bericht,setBericht]=React.useState("");
  const [loes,setLoes]=React.useState([]);
  const [loadL,setLoadL]=React.useState(false);
  const [err,setErr]=React.useState("");
  const [mailShare,setMailShare]=React.useState("");
  const [mailSent,setMailSent]=React.useState(false);
  const [emailSent,setEmailSent]=React.useState(false);
  const [dsgvo,setDsgvo]=React.useState(false);

  const gefB=bereiche.filter(b=>aktiv.includes(b.id));
  const curB=gefB[bIdx];
  const totalF=gefB.reduce((s,b)=>s+(b.fragen?b.fragen.length:0),0);
  const prog=totalF>0?Math.round(Object.keys(antw).length/totalF*100):0;
  const descValid=desc.trim().length>=10;
  const canStart=email&&branche&&descValid&&dsgvo;

  function setA(bid,fi,val){setAntw(p=>{const n={...p};n[bid+"_"+fi]=val;return n;});}
  function gs(bid){
    const b=bereiche.find(x=>x.id===bid);
    if(!b)return 0;
    const v=b.fragen.map((_,i)=>antw[bid+"_"+i]).filter(x=>x!=null);
    return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):0;
  }
  function ges(){return gefB.length?Math.round(gefB.map(b=>gs(b.id)).reduce((s,v)=>s+v,0)/gefB.length):0;}
  function komp(bid){const b=bereiche.find(x=>x.id===bid);return b?b.fragen.every((_,i)=>antw[bid+"_"+i]!==undefined):false;}
  function ov(i){return[0,33,67,100][i];}

  async function callApi(prompt,mt){
    const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:mt||1000,messages:[{role:"user",content:prompt}]})});
    const d=await r.json();
    if(d.error)throw new Error(typeof d.error==="string"?d.error:JSON.stringify(d.error));
    return d.content?d.content.map(c=>c.text||"").join(""):"";
  }

  async function sendeEmail(g){
    try{
      const schwach=gefB.filter(b=>gs(b.id)<60).map(b=>b.label).slice(0,3).join(", ");
      await fetch("/api/sendemail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,name:firma||"dort",firma:firma||"",branche:branche||"",score:g,bereiche:schwach})});
      setEmailSent(true);
    }catch(e){console.log("E-Mail Fehler:",e);}
  }

  async function ladeBereiche(){
    if(!canStart){setErr("Bitte alle Pflichtfelder ausfüllen.");return;}
    setLoadB(true);setErr("");
    const prompt="Erstelle 6 individuelle Analysebereiche fuer dieses Unternehmen.\n\nBranche: "+safe(branche)+"\nFirma: "+safe(firma)+"\nBeschreibung: "+safe(desc)+"\n\nWichtig: Die Fragen sollen DIREKT auf die Beschreibung eingehen.\n\nFormat:\n\nBEREICH 1: [Name]\n[Emoji]\n[KI-Potenzial 1 Satz]\nFRAGE 1: [Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\nFRAGE 2: [Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\nFRAGE 3: [Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\nFRAGE 4: [Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\n\nBEREICH 2: ...";
    try{
      const t=await callApi(prompt,3500);
      const p=parseBereicheText(t,branche);
      setBereiche(p);setAktiv(p.map(b=>b.id));setStep("bereiche");
    }catch(e){
      const df=getDefault(branche);
      setBereiche(df);setAktiv(df.map(b=>b.id));setStep("bereiche");
    }
    setLoadB(false);
  }

  async function analysiereReport(){
    setLoadR(true);setErr("");
    try{
      const g=ges();
      const info=gefB.map(b=>b.label+" "+gs(b.id)+"%").join(", ");
      const t=await callApi("Schreibe einen kurzen KI-Automatisierungsbericht auf Deutsch fuer "+safe(firma||branche)+" ("+safe(branche)+"). IQ-Score: "+g+" Prozent. Bereiche: "+info+". Struktur: ## IQ-Bewertung ## Staerken ## Potenzial je Bereich ## Tool-Empfehlungen ## Roadmap 3 Phasen. Max 350 Woerter.",800);
      setBericht(t);setStep("bericht");sendeEmail(g);
    }catch(e){setErr("Fehler: "+e.message);}
    setLoadR(false);
  }

  async function ladeLoes(){
    if(loes.length)return;
    setLoadL(true);
    try{
      const schwach=gefB.filter(b=>gs(b.id)<60).map(b=>b.label).join(", ")||"alle";
      const t=await callApi("Nenne 6 Tools fuer "+safe(branche)+" schwache Bereiche: "+safe(schwach)+". Trenne mit ---. Pro Tool: Name, Beschreibung, URL, Zeitersparnis.",600);
      const parts=t.split("---");const result=[];const icons={ki:"🤖",rpa:"⚙️",robotik:"🦾",daten:"📊"};
      for(let i=0;i<parts.length&&result.length<6;i++){
        const lines=parts[i].trim().split("\n").map(l=>l.replace(/^\*+|\*+$/g,"").trim()).filter(l=>l);
        if(lines.length<2)continue;
        let kat="rpa";const pl=(lines[0]+(lines[1]||"")).toLowerCase();
        if(pl.includes("ki ")||pl.includes("gpt")||pl.includes("copilot"))kat="ki";
        else if(pl.includes("robot"))kat="robotik";
        else if(pl.includes("analytic")||pl.includes("dashboard"))kat="daten";
        const url=lines.find(l=>l.includes("http"))||"https://google.com/search?q="+encodeURIComponent(lines[0]);
        const esp=lines.find(l=>l.includes("h/")||l.includes("tunden"))||"bis zu 5h/Woche";
        result.push({name:lines[0],tag:KL[kat],icon:icons[kat],kategorie:kat,desc:lines[1]||"",url,einsparung:esp});
      }
      setLoes(result);
    }catch(e){setLoes([]);}
    setLoadL(false);
  }

  function renderMd(t){
    return t
      .replace(/\*\*(.+?)\*\*/g,`<strong style='color:${TX}'>$1</strong>`)
      .replace(/^## (.+)$/gm,`<h2 style='font-size:14px;font-weight:600;margin:1.2rem 0 0.4rem;color:${TX};padding-bottom:6px;border-bottom:1px solid ${BD}'>$1</h2>`)
      .replace(/^- (.+)$/gm,`<li style='margin:5px 0;color:${T2};line-height:1.6;margin-left:16px'>$1</li>`)
      .replace(/\n\n/g,"<br/>").replace(/\n/g,"<br/>");
  }

  function btxt(){
    const g=ges();
    return "ONLION IQ\n"+"=".repeat(30)+"\nFirma: "+(firma||"-")+"\nBranche: "+branche+"\nIQ: "+g+"% | Potenzial: "+(100-g)+"%\n\n"+gefB.map(b=>b.label+": "+gs(b.id)+"%").join("\n")+"\n\n"+bericht;
  }

  function generatePDF(){
    const g=ges(),p=100-g;
    const datum=new Date().toLocaleDateString("de-DE",{year:"numeric",month:"long",day:"numeric"});
