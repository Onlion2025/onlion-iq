function safe(s){return(s||"").replace(/[^\w\s.,\-äöüÄÖÜß]/g," ").replace(/\s+/g," ").trim();}

function parseBereicheText(text,branche){
  var bereiche=[];
  var blocks=text.split(/\n(?=BEREICH)/);
  for(var i=0;i<blocks.length&&bereiche.length<6;i++){
    var block=blocks[i].trim();
    if(!block)continue;
    var lines=block.split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
    if(lines.length<4)continue;
    var label=lines[0].replace(/^BEREICH\s*\d*[:.\s]*/i,"").trim();
    var icon=lines[1]||"⚙️";
    var hint=lines[2]||"";
    var kat="rpa";
    var ll=label.toLowerCase()+hint.toLowerCase();
    if(ll.indexOf("ki ")>=0||ll.indexOf("chatbot")>=0||ll.indexOf("agent")>=0)kat="ki";
    else if(ll.indexOf("robot")>=0||ll.indexOf("maschine")>=0)kat="robotik";
    else if(ll.indexOf("daten")>=0||ll.indexOf("analytic")>=0||ll.indexOf("dashboard")>=0)kat="daten";
    var fragen=[];
    var fragenBlock=lines.slice(3).join("\n");
    var fmatches=fragenBlock.split(/FRAGE\s*\d*[:.\s]*/i).filter(function(f){return f.trim();});
    for(var j=0;j<fmatches.length&&fragen.length<4;j++){
      var flines=fmatches[j].split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
      if(flines.length<5)continue;
      var optionen=flines.slice(1,5);
      if(optionen.length===4)fragen.push({f:flines[0],o:optionen});
    }
    if(fragen.length>0)bereiche.push({id:"b"+(i+1),label:label,icon:icon,hint:hint,kiKat:kat,fragen:fragen});
  }
  if(bereiche.length<3)return getDefault(branche);
  return bereiche;
}

function App(){

  var r18=useState(false),emailSent=r18[0],setEmailSent=r18[1];
  var r19=useState(false),dsgvo=r19[0],setDsgvo=r19[1];

  var gefB=bereiche.filter(function(b){return aktiv.indexOf(b.id)>=0;});
  var curB=gefB[bIdx];
  var totalF=gefB.reduce(function(s,b){return s+(b.fragen?b.fragen.length:0);},0);
  var prog=totalF>0?Math.round(Object.keys(antw).length/totalF*100):0;
  var descValid=desc.trim().length>=10;
  var canStart=email&&branche&&descValid;

  function setA(bid,fi,val){setAntw(function(p){var n=Object.assign({},p);n[bid+"_"+fi]=val;return n;});}
  function gs(bid){var b=bereiche.filter(function(x){return x.id===bid;})[0];if(!b)return 0;var v=b.fragen.map(function(_,i){var x=antw[bid+"_"+i];return x!=null?x:null;}).filter(function(x){return x!==null;});return v.length?Math.round(v.reduce(function(s,x){return s+x;},0)/v.length):0;}
  function ges(){return gefB.length?Math.round(gefB.map(function(b){return gs(b.id);}).reduce(function(s,v){return s+v;},0)/gefB.length):0;}
  function komp(bid){var b=bereiche.filter(function(x){return x.id===bid;})[0];return b?b.fragen.every(function(_,i){return antw[bid+"_"+i]!==undefined;}):false;}
  function ov(i){return[0,33,67,100][i];}

  async function callApi(prompt,mt){
    var r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:mt||1000,messages:[{role:"user",content:prompt}]})});
    var d=await r.json();
    if(d.error)throw new Error(typeof d.error==="string"?d.error:JSON.stringify(d.error));
    return d.content?d.content.map(function(c){return c.text||"";}).join(""):"";
  }

  async function sendeEmail(g){
    try{
      var schwach=gefB.filter(function(b){return gs(b.id)<60;}).map(function(b){return b.label;}).slice(0,3).join(", ");

      setEmailSent(true);
    }catch(e){console.log("E-Mail Fehler:",e);}
  }

  async function ladeBereiche(){
    if(!canStart){setErr("Bitte alle Pflichtfelder ausfüllen.");return;}
    setLoadB(true);setErr("");
    var prompt="Erstelle 6 individuelle Analysebereiche fuer dieses Unternehmen.\n\nBranche: "+safe(branche)+"\nFirma: "+safe(firma)+"\nBeschreibung: "+safe(desc)+"\n\nWichtig: Die Fragen sollen DIREKT auf die Beschreibung eingehen und konkrete Situationen aus dem Unternehmen ansprechen.\n\nFormat (exakt einhalten):\n\nBEREICH 1: [Name]\n[Emoji]\n[KI-Potenzial in 1 Satz]\nFRAGE 1: [Konkrete Frage zum Unternehmen]\n[Option A - niedrigster Automatisierungsgrad]\n[Option B]\n[Option C]\n[Option D - hoechster Automatisierungsgrad]\nFRAGE 2: [Konkrete Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\nFRAGE 3: [Konkrete Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\nFRAGE 4: [Konkrete Frage]\n[Option A]\n[Option B]\n[Option C]\n[Option D]\n\nBEREICH 2: [Name]\n...";
    try{
      var t=await callApi(prompt,3500);
      var p=parseBereicheText(t,branche);
      setBereiche(p);setAktiv(p.map(function(b){return b.id;}));setStep("bereiche");
    }catch(e){
      var df=getDefault(branche);
      setBereiche(df);setAktiv(df.map(function(b){return b.id;}));setStep("bereiche");
    }
    setLoadB(false);
  }

  async function analysiereReport(){
    setLoadR(true);setErr("");
    try{
      var g=ges();
      var info=gefB.map(function(b){return b.label+" "+gs(b.id)+"%";}).join(", ");
      var t=await callApi("Schreibe einen kurzen KI-Automatisierungsbericht auf Deutsch fuer "+safe(firma||branche)+" ("+safe(branche)+"). IQ-Score: "+g+" Prozent. Bereiche: "+info+". Struktur: ## IQ-Bewertung ## Staerken ## Potenzial je Bereich ## Tool-Empfehlungen ## Roadmap 3 Phasen. Max 350 Woerter.",800);
      setBericht(t);setStep("bericht");sendeEmail(g);
    }catch(e){setErr("Fehler: "+e.message);}
    setLoadR(false);
  }

  async function ladeLoes(){
    if(loes.length)return;
    setLoadL(true);
    try{
      var schwach=gefB.filter(function(b){return gs(b.id)<60;}).map(function(b){return b.label;}).join(", ")||"alle";
      var t=await callApi("Nenne 6 Tools fuer "+safe(branche)+" schwache Bereiche: "+safe(schwach)+". Trenne mit ---. Pro Tool: Name, Beschreibung, URL, Zeitersparnis.",600);
      var parts=t.split("---");var result=[];var icons={ki:"🤖",rpa:"⚙️",robotik:"🦾",daten:"📊"};
      for(var i=0;i<parts.length&&result.length<6;i++){
        var lines=parts[i].trim().split("\n").map(function(l){return l.replace(/^\*+|\*+$/g,"").trim();}).filter(function(l){return l;});
        if(lines.length<2)continue;
        var kat="rpa";var pl=(lines[0]+(lines[1]||"")).toLowerCase();
        if(pl.indexOf("ki ")>=0||pl.indexOf("gpt")>=0||pl.indexOf("copilot")>=0)kat="ki";
        else if(pl.indexOf("robot")>=0)kat="robotik";
        else if(pl.indexOf("analytic")>=0||pl.indexOf("dashboard")>=0)kat="daten";
        var url=lines.filter(function(l){return l.indexOf("http")>=0;})[0]||"https://google.com/search?q="+encodeURIComponent(lines[0]);
        var esp=lines.filter(function(l){return l.indexOf("h/")>=0||l.indexOf("tunden")>=0;})[0]||"bis zu 5h/Woche";
        result.push({name:lines[0],tag:KL[kat],icon:icons[kat],kategorie:kat,desc:lines[1]||"",url:url,einsparung:esp});

    }catch(e){setLoes([]);}
    setLoadL(false);

  function generatePDF(){
    var g=ges(),p=100-g;
    var datum=new Date().toLocaleDateString("de-DE",{year:"numeric",month:"long",day:"numeric"});

  if(step==="impressum") return(

      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Welche Daten wir erheben</div>{["E-Mail-Adresse (für den Bericht)","Firmenname und Branche","Antworten des Fragebogens","Technische Daten durch Netlify-Hosting"].map(function(t,i){return(<div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:G,flexShrink:0}}>→</span><span style={{fontSize:13,color:T2}}>{t}</span></div>);})}</div>

      <div style={card}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Deine Rechte (DSGVO)</div>{["Auskunft (Art. 15)","Berichtigung (Art. 16)","Löschung (Art. 17)","Widerspruch (Art. 21)"].map(function(t,i){return(<div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:G}}>✓</span><span style={{fontSize:13,color:T2}}>{t}</span></div>);})}<p style={{fontSize:12,color:T2,marginTop:10}}>Anfragen: onlion-@outlook.de</p></div>

  );

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
