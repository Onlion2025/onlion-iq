function safe(s){return(s||"").replace(/[\u2018\u2019\u201A\u201B]/g,"'").replace(/[\u201C\u201D\u201E\u201F]/g,'"').replace(/[\u2013\u2014\u2015]/g,"-").replace(/\u00A0/g," ").replace(/[^\w\s.,;:!?'"()\/&%@+\-äöüÄÖÜß]/g," ").replace(/\s+/g," ").trim();}

function parseBereicheText(text,branche){
  var r=parseBereicheTextRaw(text);
  return(r&&r.length>=3)?r:getDefault(branche);
}
function cleanHint(h){return(h||"").replace(/^\s*[-*•]\s*/,"").replace(/^\s*KI[-\s]?Potenzial(analyse)?\s*[:\-]?\s*/i,"").trim();}
function parseBereicheTextRaw(text){
  var bereiche=[];
  var blocks=(text||"").split(/\n(?=BEREICH)/);
  for(var i=0;i<blocks.length&&bereiche.length<6;i++){
    var block=blocks[i].trim();
    if(!block)continue;
    var lines=block.split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
    if(lines.length<4)continue;
    var label=lines[0].replace(/^BEREICH\s*\d*[:.\s]*/i,"").trim();
    var icon=lines[1]||"⚙️";
    var hint=cleanHint(lines[2]||"");
    var kat="rpa";
    var ll=label.toLowerCase()+hint.toLowerCase();
    if(ll.indexOf("ki ")>=0||ll.indexOf("chatbot")>=0||ll.indexOf("agent")>=0)kat="ki";
    else if(ll.indexOf("robot")>=0||ll.indexOf("maschine")>=0)kat="robotik";
    else if(ll.indexOf("daten")>=0||ll.indexOf("analytic")>=0||ll.indexOf("dashboard")>=0)kat="daten";
    var fragen=[];
    var fragenBlock=lines.slice(3).join("\n");
    var fmatches=fragenBlock.split(/FRAGE\s*\d*[:.\s]*/i).filter(function(f){return f.trim();});
    for(var j=0;j<fmatches.length&&fragen.length<4;j++){
      var flines=fmatches[j].split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
      if(flines.length<5)continue;
      var optionen=flines.slice(1,5);
      if(optionen.length===4)fragen.push({f:flines[0],o:optionen});
    }
    if(fragen.length>0)bereiche.push({id:"b"+(i+1),label:label,icon:icon,hint:hint,kiKat:kat,fragen:fragen});
  }
  return bereiche;

                <div style={{marginBottom:12}}>
                  <div style={{fontSize:10,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:6,fontWeight:500}}>Hauptproblem</div>
                  <input id="ag-problem" style={{width:"100%",background:D3,border:"0.5px solid "+BD,borderRadius:8,color:TX,fontFamily:"inherit",fontSize:13,padding:"10px 12px",outline:"none"}} placeholder="z.B. 50 Anrufe täglich für Terminvergabe"/>
                </div>
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:10,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:6,fontWeight:500}}>Aufgabe des Agenten</div>
                  <select id="ag-aufgabe" style={{width:"100%",background:D3,border:"0.5px solid "+BD,borderRadius:8,color:TX,fontFamily:"inherit",fontSize:13,padding:"10px 12px",outline:"none"}}>
                    <option value="">Aufgabe auswählen...</option>
                    <option value="Terminvergabe automatisieren">Terminvergabe automatisieren</option>
                    <option value="Kundenanfragen per E-Mail und Chat beantworten">Kundenanfragen beantworten</option>
                    <option value="Angebote automatisch erstellen">Angebote erstellen</option>
                    <option value="Rechnungen verarbeiten und buchen">Rechnungen verarbeiten</option>
                    <option value="Leads qualifizieren und weiterleiten">Leads qualifizieren</option>
                    <option value="HR-Prozesse automatisieren">HR-Prozesse automatisieren</option>
                    <option value="Berichte und Dashboards erstellen">Berichte erstellen</option>
                    <option value="Kunden-Onboarding automatisieren">Onboarding automatisieren</option>
                  </select>
                </div>
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:10,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:6,fontWeight:500}}>Genutzte Tools</div>
                  <input id="ag-tools" style={{width:"100%",background:D3,border:"0.5px solid "+BD,borderRadius:8,color:TX,fontFamily:"inherit",fontSize:13,padding:"10px 12px",outline:"none"}} placeholder="z.B. Outlook, Excel, keine weiteren"/>
                </div>
                <div>
                  <div style={{fontSize:10,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:6,fontWeight:500}}>Besonderheiten (optional)</div>
                  <textarea id="ag-extra" style={{width:"100%",background:D3,border:"0.5px solid "+BD,borderRadius:8,color:TX,fontFamily:"inherit",fontSize:13,padding:"10px 12px",outline:"none",resize:"vertical",minHeight:70,lineHeight:1.6}} placeholder="z.B. nur Deutsch, DSGVO wichtig, keine Preise nennen..."/>
                </div>
              </div>

              <button onClick={generateAgentPrompt} disabled={agLoading} style={{...btnG,opacity:agLoading?0.6:1,marginBottom:16}}>
                {agLoading?"KI generiert Prompt...":"🤖 Agenten-Skript generieren"}
              </button>

              {agResult&&(
                <div style={{...card,borderColor:G+"40"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <div style={{fontSize:10,color:G,letterSpacing:1,textTransform:"uppercase",fontWeight:500}}>Generiertes Agenten-Skript</div>
                    <button onClick={function(){navigator.clipboard.writeText(agResult);}} style={{background:G+"18",border:"0.5px solid "+G+"40",borderRadius:6,color:G,fontSize:12,padding:"5px 12px",cursor:"pointer",fontFamily:"inherit"}}>Kopieren</button>
                  </div>
                  <div style={{fontFamily:"monospace",fontSize:12,lineHeight:1.8,color:"#ccc",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{agResult}</div>
                </div>
              )}
            </div>
          )}

        </div>
      </div>
    );
  }

  if(step==="impressum") return(
    <div style={{background:"transparent",minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
      <Logo lang={lang} setLang={setLang}/>
      <button onClick={function(){setStep("intro");}} style={{background:"transparent",border:"none",color:T2,cursor:"pointer",fontSize:13,padding:"0 0 16px 0",display:"block"}}>← Zurück</button>
      <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 20px"}}>Impressum</h1>
      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Angaben gemäß § 5 TMG</div><p style={{fontSize:14,color:TX,marginBottom:4}}>Adam Cebulla</p><p style={{fontSize:13,color:T2,marginBottom:2}}>ONLION (Einzelunternehmen)</p><p style={{fontSize:13,color:T2,marginBottom:2}}>Loher Hauptstrasse 81a</p><p style={{fontSize:13,color:T2,marginBottom:16}}>90427 Nürnberg</p><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Kontakt</div><p style={{fontSize:13,color:T2}}>E-Mail: onlion-@outlook.de</p></div>
      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Verantwortlich für den Inhalt</div><p style={{fontSize:13,color:T2}}>Adam Cebulla, Loher Hauptstrasse 81a, 90427 Nürnberg</p></div>
      <div style={card}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Haftungsausschluss</div><p style={{fontSize:12,color:T2,lineHeight:1.7}}>Die KI-gestützten Analysen dienen ausschließlich zur Information und ersetzen keine professionelle Beratung.</p></div>
    </div>
  );

  if(step==="datenschutz") return(
    <div style={{background:"transparent",minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
      <Logo lang={lang} setLang={setLang}/>
      <button onClick={function(){setStep("intro");}} style={{background:"transparent",border:"none",color:T2,cursor:"pointer",fontSize:13,padding:"0 0 16px 0",display:"block"}}>← Zurück</button>
      <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 20px"}}>Datenschutzerklärung</h1>
      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Verantwortlicher</div><p style={{fontSize:13,color:T2,lineHeight:1.7}}>Adam Cebulla · ONLION · Loher Hauptstrasse 81a · 90427 Nürnberg · onlion-@outlook.de</p></div>
      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Welche Daten wir erheben</div>{["E-Mail-Adresse (für den Bericht)","Firmenname und Branche","Antworten des Fragebogens","Technische Daten durch Netlify-Hosting"].map(function(t,i){return(<div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:G,flexShrink:0}}>→</span><span style={{fontSize:13,color:T2}}>{t}</span></div>);})}</div>
      <div style={{...card,marginBottom:16}}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Drittanbieter</div>{[["Anthropic API","anthropic.com/privacy"],["Netlify","netlify.com/privacy"],["Calendly","calendly.com/privacy"],["Brevo","brevo.com/legal/privacypolicy"]].map(function(t,i){return(<div key={i} style={{marginBottom:10}}><p style={{fontSize:13,color:TX,marginBottom:3}}>{t[0]}</p><p style={{fontSize:11,color:T2}}>{t[1]}</p></div>);})}</div>
      <div style={card}><div style={{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>Deine Rechte (DSGVO)</div>{["Auskunft (Art. 15)","Berichtigung (Art. 16)","Löschung (Art. 17)","Widerspruch (Art. 21)"].map(function(t,i){return(<div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:G}}>✓</span><span style={{fontSize:13,color:T2}}>{t}</span></div>);})}<p style={{fontSize:12,color:T2,marginTop:10}}>Anfragen: onlion-@outlook.de</p></div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
