<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ONLION IQ</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif}
input,select,textarea,button{font-family:inherit}
input,select,textarea{background:#1e1e1e;color:#f0f0f0;border:0.5px solid #2a2a2a;border-radius:8px;padding:9px 12px;width:100%;font-size:14px;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7AC800}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

var G="#7AC800",GL="#9AE020",D="#0a0a0a",D2="#141414",D3="#1e1e1e",BD="#2a2a2a",TX="#f0f0f0",T2="#888";
var BRANCHEN=["Produktion / Fertigung","Dienstleistung / Büro","Handel / Logistik","IT / Technologie","Gesundheit / Pflege","Bildung","Finanzen / Versicherung","Sonstige"];
var KK=[{key:"ki",label:"KI & Agenten",icon:"🤖",desc:"KI, Chatbots, LLMs"},{key:"rpa",label:"Automatisierung",icon:"⚙️",desc:"Workflows, RPA"},{key:"robotik",label:"Robotik",icon:"🦾",desc:"Roboter, Cobots"},{key:"daten",label:"Analytics",icon:"📊",desc:"Dashboards, BI"}];
var KC={ki:G,rpa:"#00aaff",robotik:"#ff7700",daten:"#aa44ff"};
var KL={ki:"KI-Agent",rpa:"Automatisierung",robotik:"Robotik",daten:"Analytics"};

function safe(s){
  return (s||"").replace(/[^a-zA-Z0-9 .,\-äöüÄÖÜß!?]/g,"").trim();
}

function buildBereichePrompt(branche,firma,desc){
  var b=safe(branche),f=safe(firma),d=safe(desc);
  return [
    "Erstelle 6 Analysebereiche fuer ein Unternehmen.",
    "Branche ist " + b + ".",
    "Firma ist " + f + ".",
    "Beschreibung: " + d,
    "Nenne Bereiche passend zum Unternehmen.",
    "Fuer jeden Bereich 2 Fragen mit 4 Antworten von manuell bis vollautomatisiert.",
    "Kategorie ist ki oder rpa oder robotik oder daten.",
    "Antworte ausschliesslich mit diesem JSON-Format ohne Erklaerung:",
    '{"bereiche":[{"id":"b1","label":"Bereichsname","icon":"emoji","beschreibung":"kurze Beschreibung","kiKategorie":"ki","kiHinweis":"Ein Satz zum Potenzial","fragen":[{"frage":"Frage?","optionen":["Vollstaendig manuell","Teilweise digital","Groesstenteils automatisiert","Vollstaendig automatisiert"]}]}]}'
  ].join(" ");
}

function buildBerichtPrompt(firma,branche,g,info){
  var f=safe(firma),b=safe(branche),i=safe(info);
  return [
    "Schreibe einen kurzen KI-Automatisierungsbericht auf Deutsch fuer",f,"in der Branche",b+".",
    "IQ-Score ist "+g+" Prozent.",
    "Bereiche: "+i+".",
    "Struktur: ## IQ-Bewertung ## Staerken ## Potenzial je Bereich ## Tool-Empfehlungen ## Roadmap 3 Phasen.",
    "Maximal 350 Woerter. Konkret und praxisnah."
  ].join(" ");
}

function buildLoesungenPrompt(branche,schwach){
  var b=safe(branche),s=safe(schwach);
  return [
    "Gib 6 konkrete Tool-Empfehlungen fuer",b,"mit schwachen Bereichen:",s+".",
    "Antworte ausschliesslich mit diesem JSON ohne Erklaerung:",
    '{"loesungen":[{"name":"Toolname","tag":"KI-Agent","icon":"emoji","kategorie":"ki","desc":"Ein Satz","url":"https://example.com","einsparung":"z.B. 5h pro Woche"}]}'
  ].join(" ");
}

function Logo(){
  return React.createElement("div",{style:{marginBottom:28}},
    React.createElement("div",{style:{fontWeight:700,fontSize:22,letterSpacing:3,color:TX,display:"flex"}},
      React.createElement("span",null,"ON"),
      React.createElement("span",{style:{color:G}},"L"),
      React.createElement("span",null,"ION"),
      React.createElement("span",{style:{color:G,marginLeft:6}},"IQ")
    ),
    React.createElement("div",{style:{fontSize:11,color:T2,letterSpacing:2,marginTop:2}},"INTELLIGENCE QUOTIENT")
  );
}

function Spin(){
  return React.createElement("span",{style:{display:"inline-block",width:16,height:16,border:"2px solid "+G,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}});
}

function LoadBox(props){
  return React.createElement("div",{style:{background:D2,border:"0.5px solid "+BD,borderRadius:10,padding:"2rem",textAlign:"center",marginBottom:16}},
    React.createElement("div",{style:{marginBottom:16,display:"flex",justifyContent:"center"}},React.createElement(Spin)),
    React.createElement("div",{style:{fontSize:15,color:TX,marginBottom:6,fontWeight:500}},props.msg),
    React.createElement("div",{style:{fontSize:12,color:T2,marginBottom:20}},props.sub),
    React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap"}},
      (props.steps||[]).map(function(t,i){
        return React.createElement("span",{key:i,style:{fontSize:11,color:T2,background:D3,padding:"4px 12px",borderRadius:20,animation:"pulse "+(1+i*0.4)+"s ease-in-out infinite"}},t);
      })
    )
  );
}

function IQMeter(props){
  var score=props.score;
  var c=score>66?G:score>33?"#d4a000":"#c0392b";
  var l=score>66?"Gut automatisiert":score>33?"Ausbaufähig":"Hohes Potenzial";
  return React.createElement("div",{style:{textAlign:"center",padding:"1.5rem 0"}},
    React.createElement("svg",{width:"140",height:"80",viewBox:"0 0 140 80"},
      React.createElement("path",{d:"M 10 70 A 60 60 0 0 1 130 70",fill:"none",stroke:D3,strokeWidth:"10",strokeLinecap:"round"}),
      React.createElement("path",{d:"M 10 70 A 60 60 0 0 1 130 70",fill:"none",stroke:c,strokeWidth:"10",strokeLinecap:"round",strokeDasharray:(score/100*188)+" 188"}),
      React.createElement("text",{x:"70",y:"68",textAnchor:"middle",fontSize:"22",fontWeight:"500",fill:TX},score+"%")
    ),
    React.createElement("div",{style:{fontSize:12,color:c,marginTop:4}},l)
  );
}

function App(){
  var useState=React.useState;
  var s=useState("intro"),step=s[0],setStep=s[1];
  var e1=useState(""),branche=e1[0],setBranche=e1[1];
  var e2=useState(""),firma=e2[0],setFirma=e2[1];
  var e3=useState(""),ma=e3[0],setMa=e3[1];
  var e4=useState(""),desc=e4[0],setDesc=e4[1];
  var e5=useState(""),email=e5[0],setEmail=e5[1];
  var e6=useState([]),bereiche=e6[0],setBereiche=e6[1];
  var e7=useState([]),aktiv=e7[0],setAktiv=e7[1];
  var e8=useState(false),loadB=e8[0],setLoadB=e8[1];
  var e9=useState(0),bIdx=e9[0],setBIdx=e9[1];
  var e10=useState({}),antw=e10[0],setAntw=e10[1];
  var e11=useState(false),loadR=e11[0],setLoadR=e11[1];
  var e12=useState(""),bericht=e12[0],setBericht=e12[1];
  var e13=useState([]),loes=e13[0],setLoes=e13[1];
  var e14=useState(false),loadL=e14[0],setLoadL=e14[1];
  var e15=useState(""),err=e15[0],setErr=e15[1];
  var e16=useState(""),shareMsg=e16[0],setShareMsg=e16[1];
  var e17=useState(""),mailShare=e17[0],setMailShare=e17[1];
  var e18=useState(false),mailSent=e18[0],setMailSent=e18[1];
  var e19=useState({name:"",email:"",tel:"",datum:"",msg:""}),termin=e19[0],setTermin=e19[1];
  var e20=useState(false),terminSent=e20[0],setTerminSent=e20[1];

  var gefB=bereiche.filter(function(b){return aktiv.indexOf(b.id)>=0;});
  var curB=gefB[bIdx];
  var totalF=gefB.reduce(function(s,b){return s+(b.fragen?b.fragen.length:0);},0);
  var prog=totalF>0?Math.round(Object.keys(antw).length/totalF*100):0;

  function setA(bid,fi,val){setAntw(function(p){var n=Object.assign({},p);n[bid+"_"+fi]=val;return n;});}

  function gs(bid){
    var b=bereiche.filter(function(x){return x.id===bid;})[0];
    if(!b||!b.fragen)return 0;
    var v=b.fragen.map(function(_,i){var x=antw[bid+"_"+i];return x!=null?x:null;}).filter(function(x){return x!==null;});
    return v.length?Math.round(v.reduce(function(s,x){return s+x;},0)/v.length):0;
  }

  function ges(){return gefB.length?Math.round(gefB.map(function(b){return gs(b.id);}).reduce(function(s,v){return s+v;},0)/gefB.length):0;}

  function komp(bid){
    var b=bereiche.filter(function(x){return x.id===bid;})[0];
    return b?b.fragen.every(function(_,i){return antw[bid+"_"+i]!==undefined;}):false;
  }

  function ov(i){return[0,33,67,100][i];}

  async function callApi(prompt,mt){
    var payload={model:"claude-haiku-4-5",max_tokens:mt||800,messages:[{role:"user",content:prompt}]};
    var r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    var d=await r.json();
    if(d.error)throw new Error(typeof d.error==="string"?d.error:JSON.stringify(d.error));
    return d.content?d.content.map(function(c){return c.text||"";}).join(""):"";
  }

  async function ladeBereiche(){
    if(!email||!branche){setErr("Bitte E-Mail und Branche eingeben.");return;}
    setLoadB(true);setErr("");
    try{
      var prompt=buildBereichePrompt(branche,firma,desc);
      var t=await callApi(prompt,1200);
      var clean=t.replace(/[\u0000-\u001F\u007F]/g," ").replace(/```json/g,"").replace(/```/g,"").replace(/,\s*([}\]])/g,"$1").trim();(/```json/g,"").replace(/```/g,"").trim();
      var j=JSON.parse(clean);
      setBereiche(j.bereiche);
      setAktiv(j.bereiche.map(function(b){return b.id;}));
      setStep("bereiche");
    }catch(e){setErr("Fehler: "+e.message);}
    setLoadB(false);
  }

  async function analysiereReport(){
    setLoadR(true);setErr("");
    try{
      var g=ges();
      var info=gefB.map(function(b){return b.label+"("+gs(b.id)+"%)";}).join(", ");
      var prompt=buildBerichtPrompt(firma||branche,branche,g,info);
      var t=await callApi(prompt,800);
      setBericht(t);
      setStep("bericht");
    }catch(e){setErr("Fehler: "+e.message);}
    setLoadR(false);
  }

  async function ladeLoes(){
    if(loes.length)return;
    setLoadL(true);
    try{
      var schwach=gefB.filter(function(b){return gs(b.id)<60;}).map(function(b){return b.label;}).join(", ")||"alle Bereiche";
      var prompt=buildLoesungenPrompt(branche,schwach);
      var t=await callApi(prompt,600);
      var clean=t.replace(/[\u0000-\u001F\u007F]/g," ").replace(/```json/g,"").replace(/```/g,"").replace(/,\s*([}\]])/g,"$1").trim();(/```json/g,"").replace(/```/g,"").trim();
      var j=JSON.parse(clean);
      setLoes(j.loesungen);
    }catch(e){setLoes([]);}
    setLoadL(false);
  }

  function renderMd(t){
    return t
      .replace(/\*\*(.+?)\*\*/g,"<strong style='color:"+TX+"'>$1</strong>")
      .replace(/^## (.+)$/gm,"<h2 style='font-size:15px;font-weight:500;margin:1.2rem 0 0.4rem;color:"+GL+";border-bottom:0.5px solid "+BD+";padding-bottom:4px'>$1</h2>")
      .replace(/^- (.+)$/gm,"<li style='margin:4px 0;color:"+T2+";line-height:1.5'>$1</li>")
      .replace(/(<li[^>]*>[\s\S]*?<\/li>)/gm,"$1")
      .replace(/\n\n/g,"<br/>").replace(/\n/g,"<br/>");
  }

  function btxt(){
    var g=ges();
    return "ONLION IQ\n"+"=".repeat(30)+"\nFirma: "+(firma||"-")+"\nBranche: "+branche+"\nIQ: "+g+"% | Potenzial: "+(100-g)+"%\n\n"+gefB.map(function(b){return b.label+": "+gs(b.id)+"%";}).join("\n")+"\n\n"+bericht;
  }

  var card={background:D2,border:"0.5px solid "+BD,borderRadius:10,padding:"1.25rem",marginBottom:16};
  var cardG={background:"#081200",border:"0.5px solid "+G+"40",borderRadius:10,padding:"1.25rem",marginBottom:16};
  var btnG={width:"100%",padding:"11px",borderRadius:8,border:"1px solid "+G,background:G+"18",cursor:"pointer",fontSize:14,color:G,fontWeight:500};
  var btn={width:"100%",padding:"11px",borderRadius:8,border:"0.5px solid "+BD,background:"transparent",cursor:"pointer",fontSize:14,color:TX,marginTop:8};
  var btnO={width:"100%",padding:"10px",borderRadius:8,border:"0.5px solid "+BD,background:"transparent",cursor:"pointer",fontSize:13,color:T2,marginTop:8};
  function badge(c){return{display:"inline-block",padding:"2px 8px",borderRadius:20,background:c+"22",border:"0.5px solid "+c+"66",fontSize:10,color:c};}
  function lbl(){return{fontSize:11,color:T2,letterSpacing:1,textTransform:"uppercase",marginBottom:4};}
  function div(){return{height:1,background:BD,margin:"20px 0"};}

  if(step==="intro") return(
    <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
      <Logo/>
      <h1 style={{fontSize:22,fontWeight:500,margin:"0 0 8px"}}>Wie intelligent arbeitet Ihr Unternehmen?</h1>
      <p style={{color:T2,lineHeight:1.7,fontSize:14,marginBottom:20}}>ONLION IQ analysiert mit KI Ihr Automatisierungspotenzial — kostenlos in 5 Minuten.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}}>
        {KK.map(function(k){return(
          <div key={k.key} style={{...card,marginBottom:0,display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:20}}>{k.icon}</span>
            <div><div style={{fontSize:12,fontWeight:500,color:KC[k.key]}}>{k.label}</div><div style={{fontSize:11,color:T2,marginTop:2}}>{k.desc}</div></div>
          </div>
        );})}
      </div>
      <div style={{...card,marginBottom:20}}>
        <div style={lbl()}>In 5 Minuten erhalten Sie</div>
        {[["🧠","IQ-Score (0–100%)"],["🤖","KI-Potenzial je Bereich"],["⚙️","Automatisierungs-Empfehlungen"],["🗺️","3-Phasen KI-Roadmap"]].map(function(x,i){return(
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:8,marginTop:i===0?8:0}}>
            <span style={{fontSize:16,flexShrink:0}}>{x[0]}</span><span style={{fontSize:13,color:T2}}>{x[1]}</span>
          </div>
        );})}
      </div>
      <input placeholder="Ihre E-Mail *" value={email} onChange={function(e){setEmail(e.target.value);}} type="email"/>
      <input placeholder="Firmenname (optional)" value={firma} onChange={function(e){setFirma(e.target.value);}}/>
      <input placeholder="Mitarbeiter (optional)" value={ma} onChange={function(e){setMa(e.target.value);}}/>
      <select value={branche} onChange={function(e){setBranche(e.target.value);}} style={{marginBottom:10}}>
        <option value="">Branche auswählen *</option>
        {BRANCHEN.map(function(b){return <option key={b} value={b}>{b}</option>;})}
      </select>
      <textarea placeholder="Beschreiben Sie Ihr Unternehmen kurz..." value={desc} onChange={function(e){setDesc(e.target.value);}} rows={3} style={{resize:"vertical",lineHeight:1.6,marginBottom:16}}/>
      {err&&<p style={{color:"#e05a5a",fontSize:12,marginBottom:10}}>{err}</p>}
      {loadB
        ?<LoadBox msg="KI erstellt Ihre Analysebereiche..." sub="ca. 10 Sekunden" steps={["Daten lesen","Bereiche erstellen","Fragen generieren"]}/>
        :<button disabled={!branche||!email} onClick={ladeBereiche} style={{...btnG,opacity:branche&&email?1:0.4}}>IQ-Analyse starten →</button>
      }
      <p style={{fontSize:11,color:T2,marginTop:10,textAlign:"center"}}>Ihre E-Mail wird nur für den Bericht verwendet. Kein Spam.</p>
    </div>
  );

  if(step==="bereiche"){
    var alle=aktiv.length===bereiche.length;
    return(
      <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
        <Logo/>
        <button onClick={function(){setStep("intro");}} style={{background:"transparent",border:"none",color:T2,cursor:"pointer",fontSize:13,padding:"0 0 16px 0",display:"block"}}>← Zurück</button>
        <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 4px"}}>KI-generierte Analysebereiche</h1>
        <p style={{color:T2,fontSize:13,marginBottom:20}}>Für: <span style={{color:G}}>{firma||branche}</span></p>
        <div style={{...card,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <span style={{fontSize:13,color:T2}}>{aktiv.length} von {bereiche.length}</span>
            <button onClick={function(){setAktiv(alle?[]:bereiche.map(function(b){return b.id;}));}} style={{padding:"5px 12px",borderRadius:20,border:"0.5px solid "+(alle?G:BD),background:alle?G+"18":"transparent",cursor:"pointer",fontSize:12,color:alle?G:T2}}>{alle?"Alle abwählen":"Alle auswählen"}</button>
          </div>
          {bereiche.map(function(b){
            var a=aktiv.indexOf(b.id)>=0,kc=KC[b.kiKategorie]||G,kl=KL[b.kiKategorie]||"KI";
            return(
              <div key={b.id} onClick={function(){setAktiv(function(p){return a?p.filter(function(id){return id!==b.id;}):[...p,b.id];});}} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 14px",borderRadius:8,border:"0.5px solid "+(a?G:BD),background:a?G+"0d":"transparent",marginBottom:8,cursor:"pointer"}}>
                <div style={{width:20,height:20,borderRadius:5,border:"1.5px solid "+(a?G:BD),background:a?G:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:12,color:D,fontWeight:700,marginTop:3}}>{a?"✓":""}</div>
                <div style={{fontSize:22,flexShrink:0,marginTop:1}}>{b.icon}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:3}}>
                    <span style={{fontSize:14,color:a?TX:T2,fontWeight:a?500:400}}>{b.label}</span>
                    <span style={badge(kc)}>{kl}</span>
                  </div>
                  <div style={{fontSize:12,color:T2,lineHeight:1.5,marginBottom:4}}>{b.beschreibung}</div>
                  <div style={{fontSize:11,color:kc+"99",fontStyle:"italic"}}>{b.kiHinweis}</div>
                </div>
              </div>
            );
          })}
        </div>
        <button disabled={aktiv.length===0} onClick={function(){setBIdx(0);setAntw({});setStep("fragebogen");}} style={{...btnG,opacity:aktiv.length>0?1:0.4}}>
          Analyse starten ({aktiv.length} Bereiche) →
        </button>
      </div>
    );
  }

  if(step==="fragebogen"&&curB){
    var kc=KC[curB.kiKategorie]||G,kl=KL[curB.kiKategorie]||"KI";
    return(
      <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
        <Logo/>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
          <span style={{fontSize:12,color:T2}}>Fortschritt</span><span style={{fontSize:12,color:G}}>{prog}%</span>
        </div>
        <div style={{height:3,background:D3,borderRadius:4,marginBottom:20,overflow:"hidden"}}>
          <div style={{height:"100%",width:prog+"%",background:G,borderRadius:4,transition:"width 0.3s"}}/>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
          {gefB.map(function(b,i){
            var a=i===bIdx,dn=komp(b.id);
            return <button key={b.id} onClick={function(){setBIdx(i);}} style={{padding:"4px 10px",borderRadius:20,border:"0.5px solid "+(a?G:dn?"#1a3a0a":BD),background:a?G+"18":dn?"#0f2005":"transparent",fontSize:12,cursor:"pointer",color:a?G:dn?GL:T2}}>{b.icon} {b.label}</button>;
          })}
        </div>
        <div style={card}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:4}}>
            <h2 style={{fontSize:16,fontWeight:500,margin:0,color:TX}}>{curB.icon} {curB.label}</h2>
            <span style={{...badge(kc),whiteSpace:"nowrap",marginTop:2}}>{kl}</span>
          </div>
          <p style={{fontSize:12,color:T2,margin:"0 0 6px",lineHeight:1.5}}>{curB.beschreibung}</p>
          <div style={{background:kc+"0d",border:"0.5px solid "+kc+"33",borderRadius:6,padding:"8px 10px",marginBottom:16,display:"flex",gap:8}}>
            <span style={{fontSize:14,flexShrink:0}}>💡</span>
            <span style={{fontSize:11,color:kc+"cc",lineHeight:1.5}}><strong style={{color:kc}}>KI-Potenzial:</strong> {curB.kiHinweis}</span>
          </div>
          {(curB.fragen||[]).map(function(item,i){
            return(
              <div key={i} style={{marginBottom:20,borderBottom:i<curB.fragen.length-1?"0.5px solid "+BD:"none",paddingBottom:i<curB.fragen.length-1?16:0}}>
                <p style={{fontSize:14,marginBottom:10,lineHeight:1.6,color:TX,fontWeight:500}}>{i+1}. {item.frage}</p>
                {(item.optionen||[]).map(function(opt,oi){
                  var val=ov(oi),key=curB.id+"_"+i,sel=antw[key]===val;
                  return <button key={oi} onClick={function(){setA(curB.id,i,val);}} style={{padding:"10px 14px",borderRadius:8,border:"0.5px solid "+(sel?G:BD),background:sel?G+"18":"transparent",fontSize:13,textAlign:"left",cursor:"pointer",color:sel?G:TX,marginBottom:8,width:"100%",display:"block",lineHeight:1.5}}><span style={{color:sel?G:T2,marginRight:8}}>{sel?"◉":"○"}</span>{opt}</button>;
                })}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:8}}>
          {bIdx>0&&<button onClick={function(){setBIdx(function(i){return i-1;});}} style={{...btn,flex:1}}>← Zurück</button>}
          {bIdx<gefB.length-1
            ?<button onClick={function(){setBIdx(function(i){return i+1;});}} style={{...btn,flex:2}}>Weiter →</button>
            :<button onClick={function(){setStep("auswertung");}} style={{...btnG,flex:2,marginTop:0}}>Zum IQ-Score →</button>
          }
        </div>
      </div>
    );
  }

  if(step==="auswertung"){
    var g=ges(),p=100-g;
    return(
      <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
        <Logo/>
        <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 4px"}}>Ihr ONLION IQ-Score</h1>
        <p style={{color:T2,fontSize:13,marginBottom:0}}>{firma||"Ihr Unternehmen"} · {branche}</p>
        <IQMeter score={g}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
          <div style={card}><div style={lbl()}>IQ-Score</div><div style={{fontSize:28,fontWeight:500}}>{g}%</div></div>
          <div style={cardG}><div style={{...lbl(),color:G+"99"}}>KI-Potenzial</div><div style={{fontSize:28,fontWeight:500,color:G}}>{p}%</div></div>
        </div>
        {gefB.map(function(b){
          var sc=gs(b.id),kc=KC[b.kiKategorie]||G,kl=KL[b.kiKategorie]||"KI";
          return(
            <div key={b.id} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:13,color:T2}}>{b.icon} {b.label}</span>
                  <span style={{...badge(kc),fontSize:9}}>{kl}</span>
                </div>
                <span style={{fontSize:12,color:TX}}>{sc}% <span style={{color:G}}>+{100-sc}%</span></span>
              </div>
              <div style={{height:5,background:D3,borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:sc+"%",background:sc>66?G:sc>33?"#a0a000":"#7a2a2a",borderRadius:4,transition:"width 0.5s"}}/>
              </div>
            </div>
          );
        })}
        {err&&<p style={{color:"#e05a5a",fontSize:12,marginBottom:10}}>{err}</p>}
        <div style={div()}/>
        {loadR
          ?<LoadBox msg="KI erstellt Ihren Bericht..." sub="ca. 10 Sekunden" steps={["Auswerten","Empfehlungen","Roadmap"]}/>
          :<button onClick={analysiereReport} style={btnG}>KI-Bericht & Roadmap erstellen →</button>
        }
        {!loadR&&<button onClick={function(){setStep("fragebogen");}} style={btn}>← Antworten bearbeiten</button>}
      </div>
    );
  }

  if(step==="bericht"){
    var pot=100-ges();
    return(
      <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
        <Logo/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div><h1 style={{fontSize:18,fontWeight:500,margin:"0 0 4px"}}>IQ-Bericht & KI-Roadmap</h1><p style={{color:T2,fontSize:12,margin:0}}>{firma||"Ihr Unternehmen"} · {branche}</p></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:26,fontWeight:500,color:G}}>{pot}%</div><div style={{fontSize:9,color:T2,letterSpacing:1}}>KI-POTENZIAL</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(gefB.length,3)+",1fr)",gap:8,marginBottom:16}}>
          {gefB.map(function(b){var kc=KC[b.kiKategorie]||G;return(
            <div key={b.id} style={{...card,padding:"0.75rem",textAlign:"center",marginBottom:0}}>
              <div style={{fontSize:9,color:T2,marginBottom:2}}>{b.label}</div>
              <div style={{fontSize:18,fontWeight:500,color:gs(b.id)<50?kc:TX}}>{gs(b.id)}%</div>
              <div style={{fontSize:9,color:kc,marginTop:2}}>{KL[b.kiKategorie]||""}</div>
            </div>
          );})}
        </div>
        <div style={{...card,lineHeight:1.7,fontSize:13,color:T2,marginBottom:16}} dangerouslySetInnerHTML={{__html:renderMd(bericht)}}/>
        <div style={{...card,marginBottom:16}}>
          <div style={lbl()}>Bericht teilen</div>
          <div style={{display:"flex",gap:8,marginBottom:12,marginTop:8}}>
            <button onClick={function(){navigator.clipboard.writeText(btxt()).then(function(){setShareMsg("Kopiert!");setTimeout(function(){setShareMsg("");},2500);});}} style={{flex:1,padding:"9px",borderRadius:8,border:"0.5px solid "+BD,background:"transparent",cursor:"pointer",fontSize:13,color:T2}}>📋 Kopieren</button>
            <button onClick={function(){var bl=new Blob([btxt()],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="ONLION-IQ-"+(firma||"Bericht")+".txt";a.click();}} style={{flex:1,padding:"9px",borderRadius:8,border:"0.5px solid "+BD,background:"transparent",cursor:"pointer",fontSize:13,color:T2}}>⬇ Download</button>
          </div>
          <div style={{display:"flex",gap:8}}>
            <input placeholder="Per E-Mail senden..." value={mailShare} onChange={function(e){setMailShare(e.target.value);}} style={{marginBottom:0,flex:1}}/>
            <button onClick={function(){if(!mailShare)return;window.open("mailto:"+mailShare+"?subject=ONLION IQ Bericht&body="+encodeURIComponent(btxt()));setMailSent(true);setTimeout(function(){setMailSent(false);},3000);}} style={{padding:"9px 14px",borderRadius:8,border:"0.5px solid "+G,background:G+"18",cursor:"pointer",fontSize:13,color:G,whiteSpace:"nowrap"}}>{mailSent?"Gesendet ✓":"Senden"}</button>
          </div>
          {shareMsg&&<p style={{fontSize:12,color:G,marginTop:8,marginBottom:0}}>{shareMsg}</p>}
        </div>
        <div style={div()}/>
        <div style={lbl()}>Nächste Schritte</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10,marginTop:8}}>
          <button onClick={function(){setStep("loesungen");ladeLoes();}} style={{background:G+"18",border:"1px solid "+G,borderRadius:10,padding:"1rem",cursor:"pointer",textAlign:"left"}}>
            <div style={{fontSize:20,marginBottom:6}}>🤖</div>
            <div style={{fontSize:14,fontWeight:500,color:G,marginBottom:4}}>KI-Lösungen</div>
            <div style={{fontSize:12,color:T2}}>Tools entdecken</div>
          </button>
          <button onClick={function(){setStep("termin");}} style={{background:"#0d0d0d",border:"1px solid "+BD,borderRadius:10,padding:"1rem",cursor:"pointer",textAlign:"left"}}>
            <div style={{fontSize:20,marginBottom:6}}>📅</div>
            <div style={{fontSize:14,fontWeight:500,color:TX,marginBottom:4}}>Kostenloses Gespräch</div>
            <div style={{fontSize:12,color:T2}}>Termin buchen</div>
          </button>
        </div>
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={function(){setStep("auswertung");}} style={{...btnO,flex:1,marginTop:0}}>← IQ-Score</button>
          <button onClick={function(){setAntw({});setBranche("");setFirma("");setMa("");setDesc("");setEmail("");setBericht("");setBereiche([]);setAktiv([]);setLoes([]);setStep("intro");}} style={{...btnO,flex:1,marginTop:0}}>Neue Analyse</button>
        </div>
      </div>
    );
  }

  if(step==="loesungen") return(
    <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
      <Logo/>
      <button onClick={function(){setStep("bericht");}} style={{background:"transparent",border:"none",color:T2,cursor:"pointer",fontSize:13,padding:"0 0 16px 0",display:"block"}}>← Zurück</button>
      <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 6px"}}>KI & Automatisierungs-Lösungen</h1>
      <p style={{color:T2,fontSize:13,marginBottom:16}}>Für <span style={{color:G}}>{firma||branche}</span></p>
      {loadL
        ?<LoadBox msg="KI sucht passende Lösungen..." sub="ca. 8 Sekunden" steps={["Bereiche prüfen","Tools suchen","Empfehlungen"]}/>
        :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
          {loes.map(function(l,i){var kc=KC[l.kategorie]||G;return(
            <div key={i} style={{...card,marginBottom:0,borderTop:"2px solid "+kc+"44"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <span style={{fontSize:22}}>{l.icon}</span>
                <span style={{...badge(kc),fontSize:9}}>{l.tag}</span>
              </div>
              <div style={{fontSize:13,fontWeight:500,color:TX,marginBottom:5}}>{l.name}</div>
              <div style={{fontSize:11,color:T2,lineHeight:1.5,marginBottom:6}}>{l.desc}</div>
              {l.einsparung&&<div style={{fontSize:10,color:G,marginBottom:6}}>💰 {l.einsparung}</div>}
              {l.url&&<a href={l.url} style={{fontSize:10,color:kc,textDecoration:"none"}} target="_blank">Mehr →</a>}
            </div>
          );})}
        </div>
      }
      <div style={{...cardG,textAlign:"center",padding:"1.5rem"}}>
        <div style={{fontSize:24,marginBottom:8}}>🎯</div>
        <div style={{fontSize:15,fontWeight:500,color:G,marginBottom:8}}>Individuelle KI-Beratung?</div>
        <p style={{fontSize:13,color:T2,marginBottom:16,lineHeight:1.6}}>30 Minuten, kostenlos — welche Lösungen wirklich passen.</p>
        <button onClick={function(){setStep("termin");}} style={{...btnG,marginTop:0}}>Kostenloses Gespräch buchen →</button>
      </div>
    </div>
  );

  if(step==="termin"){
    var tg=ges();
    return(
      <div style={{background:D,minHeight:"100vh",color:TX,padding:"1.5rem",maxWidth:620,margin:"0 auto"}}>
        <Logo/>
        <button onClick={function(){setStep("bericht");}} style={{background:"transparent",border:"none",color:T2,cursor:"pointer",fontSize:13,padding:"0 0 16px 0",display:"block"}}>← Zurück</button>
        {!terminSent
          ?<>
            <h1 style={{fontSize:20,fontWeight:500,margin:"0 0 6px"}}>Kostenloses KI-Beratungsgespräch</h1>
            <p style={{color:T2,fontSize:13,marginBottom:20}}>30 Minuten · kostenlos · unverbindlich</p>
            <div style={{...cardG,marginBottom:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontSize:12,color:G+"99",marginBottom:4}}>Ihr KI-Potenzial</div><div style={{fontSize:24,fontWeight:500,color:G}}>{100-tg}% ungenutzt</div></div>
                <div style={{fontSize:36}}>🚀</div>
              </div>
            </div>
            <div style={card}>
              <input placeholder="Name *" value={termin.name} onChange={function(e){setTermin(function(t){return Object.assign({},t,{name:e.target.value});});}}/>
              <input placeholder="E-Mail *" value={termin.email} onChange={function(e){setTermin(function(t){return Object.assign({},t,{email:e.target.value});});}}/>
              <input placeholder="Telefon (optional)" value={termin.tel} onChange={function(e){setTermin(function(t){return Object.assign({},t,{tel:e.target.value});});}}/>
              <input type="date" value={termin.datum} onChange={function(e){setTermin(function(t){return Object.assign({},t,{datum:e.target.value});});}} style={{colorScheme:"dark"}}/>
              <textarea placeholder="Was interessiert Sie?" value={termin.msg} onChange={function(e){setTermin(function(t){return Object.assign({},t,{msg:e.target.value});});}} rows={3} style={{resize:"vertical",marginBottom:0}}/>
            </div>
            <button disabled={!termin.name||!termin.email} onClick={function(){window.open("mailto:info@onlion.de?subject=Beratung ONLION IQ&body=Name: "+termin.name+"%0AEmail: "+termin.email+"%0ATel: "+(termin.tel||"-")+"%0ADatum: "+(termin.datum||"-")+"%0ANachricht: "+(termin.msg||"-")+"%0A%0AIQ: "+tg+"%25 | Potenzial: "+(100-tg)+"%25%0ABranche: "+branche);setTerminSent(true);}} style={{...btnG,opacity:termin.name&&termin.email?1:0.4}}>Termin anfragen →</button>
          </>
          :<div style={{textAlign:"center",paddingTop:"2rem"}}>
            <div style={{fontSize:48,marginBottom:16}}>✅</div>
            <h2 style={{fontSize:20,fontWeight:500,marginBottom:8,color:G}}>Anfrage gesendet!</h2>
            <p style={{color:T2,fontSize:14,lineHeight:1.7,marginBottom:24}}>Vielen Dank, {termin.name}!<br/>Wir melden uns innerhalb von 24 Stunden.</p>
            <button onClick={function(){setStep("bericht");}} style={btnG}>← Zurück zum Bericht</button>
          </div>
        }
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
