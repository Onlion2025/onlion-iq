body{background:#0a0a0a;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif;position:relative;min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('robot.png');background-size:cover;background-position:center center;background-repeat:no-repeat;z-index:0}
body::after{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center, transparent 0%, rgba(10,10,10,0.35) 100%);pointer-events:none;z-index:1}
@media (max-width:768px){

}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{-webkit-text-fill-color:#f0f0f0;-webkit-box-shadow:0 0 0 1000px rgba(50,55,50,0.9) inset;box-shadow:0 0 0 1000px rgba(50,55,50,0.9) inset;transition:background-color 9999s ease-in-out 0s;caret-color:#f0f0f0}
#root{position:relative;z-index:2}
input,select,textarea,button{font-family:inherit}
input,select,textarea{background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f0f0f0;border:0.5px solid rgba(255,255,255,0.2);border-radius:8px;padding:9px 12px;width:100%;font-size:14px;margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7AC800}
select option{background:#1a1a1a;color:#f0f0f0}
::placeholder{color:#f0f0f0;opacity:1}
::-webkit-input-placeholder{color:#f0f0f0}
::-moz-placeholder{color:#f0f0f0;opacity:1}
textarea::placeholder{color:#888;opacity:1}
textarea::-webkit-input-placeholder{color:#f0f0f0}
textarea::-moz-placeholder{color:#f0f0f0;opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes softGlow{0%,100%{text-shadow:0 0 5px rgba(122,200,0,0.4),0 0 10px rgba(122,200,0,0.25)}50%{text-shadow:0 0 14px rgba(122,200,0,0.95),0 0 28px rgba(122,200,0,0.6),0 0 42px rgba(122,200,0,0.35)}}

function parseBereicheText(text,branche){
  var r=parseBereicheTextRaw(text);
  return(r&&r.length>=3)?r:getDefault(branche);
}
function cleanHint(h){return(h||"").replace(/^\s*[-*•]\s*/,"").replace(/^\s*KI[-\s]?Potenzial(analyse)?\s*[:\-]?\s*/i,"").trim();}
function parseBereicheTextRaw(text){
  var bereiche=[];
  var blocks=(text||"").split(/\n(?=BEREICH)/);
  for(var i=0;i<blocks.length&&bereiche.length<6;i++){
    var block=blocks[i].trim();
    if(!block)continue;
    var lines=block.split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
    if(lines.length<4)continue;
    var label=lines[0].replace(/^BEREICH\s*\d*[:.\s]*/i,"").trim();
    var icon=lines[1]||"⚙️";
    var hint=cleanHint(lines[2]||"");
    var kat="rpa";
    var ll=label.toLowerCase()+hint.toLowerCase();
    if(ll.indexOf("ki ")>=0||ll.indexOf("chatbot")>=0||ll.indexOf("agent")>=0)kat="ki";
    else if(ll.indexOf("robot")>=0||ll.indexOf("maschine")>=0)kat="robotik";
    else if(ll.indexOf("daten")>=0||ll.indexOf("analytic")>=0||ll.indexOf("dashboard")>=0)kat="daten";
    var fragen=[];
    var fragenBlock=lines.slice(3).join("\n");
    var fmatches=fragenBlock.split(/FRAGE\s*\d*[:.\s]*/i).filter(function(f){return f.trim();});
    for(var j=0;j<fmatches.length&&fragen.length<4;j++){
      var flines=fmatches[j].split("\n").map(function(l){return l.trim();}).filter(function(l){return l;});
      if(flines.length<5)continue;
      var optionen=flines.slice(1,5);
      if(optionen.length===4)fragen.push({f:flines[0],o:optionen});
    }
    if(fragen.length>0)bereiche.push({id:"b"+(i+1),label:label,icon:icon,hint:hint,kiKat:kat,fragen:fragen});
  }
  return bereiche;
}

  async function uebersetzeBereiche(bereiche){
    // Uebersetzt die statischen Standardbereiche in die aktuelle Sprache.
    // Struktur (id, icon, kiKat) bleibt unveraendert, nur Texte werden ersetzt.
    var payload=bereiche.map(function(b){
      return {id:b.id,label:b.label,hint:b.hint,fragen:b.fragen.map(function(f){return {f:f.f,o:f.o};})};
    });
    var prompt="Uebersetze die Texte im folgenden JSON ins "+t("aiLang")+". Uebersetze NUR die Werte von 'label', 'hint', 'f' und die Eintraege in 'o'. Aendere KEINE 'id'-Werte. Behalte die exakte JSON-Struktur und alle Schluessel bei. Gib AUSSCHLIESSLICH gueltiges JSON zurueck, ohne Markdown, ohne Backticks, ohne Erklaerung.\n\n"+JSON.stringify(payload);
    var raw=await callApi(prompt,2000);
    var clean=raw.replace(/```json/g,"").replace(/```/g,"").trim();
    var s=clean.indexOf("["),e=clean.lastIndexOf("]");
    if(s>=0&&e>s)clean=clean.substring(s,e+1);
    var arr=JSON.parse(clean);
    // Uebersetzte Texte zurueck in Originalstruktur mappen (Icons/kiKat erhalten)
    return bereiche.map(function(b,i){
      var u=arr[i]||{};
      return {
        id:b.id,
        label:u.label||b.label,
        icon:b.icon,
        kiKat:b.kiKat,
        hint:u.hint||b.hint,
        fragen:b.fragen.map(function(f,j){
          var uf=(u.fragen&&u.fragen[j])?u.fragen[j]:{};
          return {f:uf.f||f.f,o:(uf.o&&uf.o.length===f.o.length)?uf.o:f.o};
        })
      };
    });
  }

      var line=lines[i];
      // Tabelle erkennen: Zeile beginnt mit | und naechste Zeile ist Trenner |---|
      if(/^\s*\|/.test(line)&&i+1<lines.length&&/^\s*\|[\s:-]*\|/.test(lines[i+1])){
        var headers=line.split("|").map(function(c){return c.trim();}).filter(function(c){return c!=="";});
        i+=2; // Kopf + Trennzeile ueberspringen
        while(i<lines.length&&/^\s*\|/.test(lines[i])){
          var cells=lines[i].split("|").map(function(c){return c.trim();}).filter(function(c){return c!=="";});
          html+="<div style='background:rgba(122,200,0,0.06);border:0.5px solid "+BD+";border-radius:8px;padding:10px 12px;margin:8px 0'>";
          for(var c=0;c<cells.length;c++){
            var label=headers[c]?headers[c]:"";
            var val=cells[c].replace(/\*\*(.+?)\*\*/g,"<strong style='color:"+GL+"'>$1</strong>");
            if(c===0){
              html+="<div style='font-size:14px;font-weight:600;color:"+TX+";margin-bottom:6px'>"+val+"</div>";
            }else{
              html+="<div style='font-size:12px;color:"+T2+";margin-bottom:2px'><span style='color:"+T2+"99'>"+label+":</span> "+val+"</div>";
            }
          }
          html+="</div>";
          i++;
        }
        continue;
      }
      // Ueberschriften
      if(/^### (.+)$/.test(line)){
        html+="<h3 style='font-size:14px;font-weight:600;margin:1.1rem 0 0.4rem;color:"+GL+"'>"+line.replace(/^### /,"")+"</h3>";i++;continue;
      }
      if(/^## (.+)$/.test(line)){
        html+="<h2 style='font-size:16px;font-weight:600;margin:1.3rem 0 0.5rem;color:"+GL+";border-bottom:0.5px solid "+BD+";padding-bottom:5px'>"+line.replace(/^## /,"")+"</h2>";i++;continue;
      }
      if(/^# (.+)$/.test(line)){
        html+="<h1 style='font-size:18px;font-weight:700;margin:0.5rem 0 0.8rem;color:"+G+"'>"+line.replace(/^# /,"")+"</h1>";i++;continue;
      }
      // Bullet-Punkte
      if(/^[-*] (.+)$/.test(line)){
        var items="";
        while(i<lines.length&&/^[-*] (.+)$/.test(lines[i])){
          var txt=lines[i].replace(/^[-*] /,"").replace(/\*\*(.+?)\*\*/g,"<strong style='color:"+TX+"'>$1</strong>");
          items+="<li style='margin:5px 0;color:"+T2+";line-height:1.6'>"+txt+"</li>";
          i++;
        }
        html+="<ul style='margin:8px 0;padding-left:20px'>"+items+"</ul>";
        continue;
      }
      // Leerzeile
      if(line.trim()===""){html+="<div style='height:8px'></div>";i++;continue;}
      // Normaler Absatz
      var p=line.replace(/\*\*(.+?)\*\*/g,"<strong style='color:"+TX+"'>$1</strong>");
      html+="<p style='margin:6px 0;color:"+T2+";line-height:1.7;font-size:13px'>"+p+"</p>";
      i++;
    }
    return html;
  }
